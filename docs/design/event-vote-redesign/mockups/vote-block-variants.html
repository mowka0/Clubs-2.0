<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Событие: блок голосования — варианты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ТОКЕНЫ — копия brand-theme.css (Banco-Plata), обе темы.
   ============================================================ */
:root {
  --bg:            #0B0B0E;
  --text:          #F4F4F6;
  --text-dim:      rgba(244, 244, 246, 0.6);
  --text-faint:    rgba(244, 244, 246, 0.45);
  --glass-bg:      linear-gradient(135deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.015) 100%);
  --glass-border:  rgba(255, 255, 255, 0.08);
  --glass-shadow:  inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 24px rgba(0,0,0,0.25);
  --surface:       rgba(255, 255, 255, 0.04);
  --surface-2:     rgba(255, 255, 255, 0.05);
  --hairline:      rgba(255, 255, 255, 0.06);
  --hairline-2:    rgba(255, 255, 255, 0.1);
  --card-solid:    #17171C;
  --accent:        #F47B3C;
  --accent-deep:   #D5611C;
  --accent-soft:   rgba(244, 123, 60, 0.14);
  --accent-shadow:      rgba(244, 123, 60, 0.30);
  --accent-shadow-soft: rgba(244, 123, 60, 0.15);
  --accent-grad:   linear-gradient(135deg, #FFA070 0%, #F47B3C 100%);
  --grad-num:      linear-gradient(135deg, #FFE0B5 0%, #FF9B6E 35%, #E84C9A 70%, #6A3DCC 100%);
  --on-accent:     #2A0E04;
  --live:          #66D49A;
  --live-soft:     rgba(79, 160, 120, 0.18);
  --danger:        #FF8B8B;
  --danger-soft:   rgba(255, 139, 139, 0.14);
  --vote-go:       #F47B3C;
  --vote-maybe:    #8E5DFF;
  --vote-no:       #6B6B70;
  /* Градиент главной кнопки — отдельным токеном, чтобы переключатель палитры мог его подменить. */
  --cta-grad:      var(--accent-grad);
  /* Трек кольца-прогресса — производный от цвета «иду», поэтому следует за палитрой. */
  --ring-track:    color-mix(in srgb, var(--vote-go) 16%, transparent);
  --neu-lo:        rgba(255, 255, 255, 0.055);
  --neu-hi:        rgba(0, 0, 0, 0.55);
  /* Хром страницы-мокапа (вне продукта) */
  --lab-bg:        #131317;
  --lab-panel:     #1C1C22;
  --lab-line:      rgba(255,255,255,0.09);
  --lab-text:      #E8E8EC;
  --lab-dim:       rgba(232,232,236,0.55);
}
[data-theme="light"] {
  --bg:            #F7F6F3;
  --text:          #1A1A1A;
  --text-dim:      #6B6B70;
  --text-faint:    #8A8A8E;
  --glass-bg:      linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(252,252,252,0.85) 100%);
  --glass-border:  rgba(0, 0, 0, 0.05);
  --glass-shadow:  inset 0 1px 0 rgba(255,255,255,1), 0 1px 3px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.05);
  --surface:       rgba(255, 255, 255, 0.85);
  --surface-2:     #FFFFFF;
  --hairline:      rgba(0, 0, 0, 0.06);
  --hairline-2:    rgba(0, 0, 0, 0.1);
  --card-solid:    #FFFFFF;
  --accent-soft:   rgba(244, 123, 60, 0.12);
  --accent-shadow:      rgba(213, 97, 28, 0.24);
  --accent-shadow-soft: rgba(213, 97, 28, 0.12);
  --accent-grad:   linear-gradient(135deg, #F47B3C 0%, #D5611C 100%);
  --grad-num:      linear-gradient(135deg, #E97339 0%, #C4407A 50%, #7A4FD9 100%);
  --on-accent:     #FFFFFF;
  --live:          #2E7D5A;
  --live-soft:     rgba(46, 125, 90, 0.12);
  --danger-soft:   rgba(216, 64, 64, 0.10);
  --neu-lo:        #FFFFFF;
  --neu-hi:        rgba(28, 26, 22, 0.14);
}

/* «Светофор» — палитра как в присланном референсе: иду зелёный, возможно оранжевый,
   не иду красный. Наша штатная палитра голосования другая (оранжевый / фиолетовый /
   серый), поэтому вынесено в переключатель — сравнить и решить. */
[data-palette="traffic"] {
  --vote-go:       var(--live);
  --vote-maybe:    var(--accent);
  --vote-no:       var(--danger);
  --cta-grad:      linear-gradient(135deg, #7BE0AC 0%, #3FA877 100%);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--lab-bg); color: var(--lab-text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 0 0 60px;
}
[data-theme="light"] body { --lab-bg: #EDEBE6; --lab-panel: #FFFFFF; --lab-line: rgba(0,0,0,0.08); --lab-text: #1A1A1A; --lab-dim: #6B6B70; }

/* ---------- Шапка-лаборатория ---------- */
.lab-bar {
  position: sticky; top: 0; z-index: 10;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding: 14px 20px; background: var(--lab-panel); border-bottom: 1px solid var(--lab-line);
}
.lab-title { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; margin-right: auto; }
.lab-title span { color: var(--lab-dim); font-weight: 500; margin-left: 8px; font-size: 12.5px; }
.lab-group { display: flex; align-items: center; gap: 6px; }
.lab-group > label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--lab-dim); margin-right: 2px; }
.lab-btn {
  padding: 6px 11px; border-radius: 9px; border: 1px solid var(--lab-line);
  background: transparent; color: var(--lab-text); font-family: inherit;
  font-size: 12px; font-weight: 600; cursor: pointer;
}
.lab-btn.on { background: var(--accent); border-color: transparent; color: #fff; }

.lab-hint { padding: 16px 20px 4px; font-size: 12.5px; color: var(--lab-dim); max-width: 900px; line-height: 1.55; }
.lab-hint b { color: var(--lab-text); font-weight: 600; }

/* ---------- Сетка вариантов ---------- */
.grid {
  display: flex; flex-wrap: wrap; gap: 26px;
  padding: 18px 20px;
}
.col { width: 372px; flex: 0 0 auto; }
.col-head { margin-bottom: 10px; }
.col-num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 7px; margin-right: 8px;
  background: var(--accent-soft); color: var(--accent); font-size: 11.5px; font-weight: 800;
}
.col.is-now .col-num { background: rgba(120,120,130,0.18); color: var(--lab-dim); }
.col-name { font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; }
.col-idea { margin-top: 5px; font-size: 12px; color: var(--lab-dim); line-height: 1.5; }

.phone {
  background: var(--bg); border-radius: 22px; padding: 16px;
  border: 1px solid var(--lab-line);
  transition: background-color 0.2s ease;
}
.h-badge {
  margin-top: 8px; font-size: 11px; color: var(--lab-dim);
  display: flex; align-items: center; gap: 6px;
}
.h-badge b { color: var(--lab-text); font-weight: 600; }
.pros { margin: 10px 0 0; padding: 0; list-style: none; font-size: 11.5px; line-height: 1.6; }
.pros li { padding-left: 16px; position: relative; color: var(--lab-dim); }
.pros li::before { position: absolute; left: 0; }
.pros li.p::before { content: '+'; color: var(--live); font-weight: 800; }
.pros li.m::before { content: '−'; color: var(--danger); font-weight: 800; }

/* ============================================================
   ОБЩЕЕ ИЗ ПРОДУКТА (redesign.css)
   ============================================================ */
.rd-glass {
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  border-radius: 22px; box-shadow: var(--glass-shadow);
}
.rd-section-sub-h {
  display: flex; align-items: baseline; gap: 11px;
  font-size: 9.5px; font-weight: 800; letter-spacing: 0.19em;
  text-transform: uppercase; color: var(--text-faint);
  margin: 0 0 8px;
}
.rd-section-sub-h::after { content: ''; flex: 1; height: 1px; background: currentColor; opacity: 0.22; }
.rd-hint { font-size: 11.5px; color: var(--text-faint); line-height: 1.4; padding-left: 2px; }
.rd-badge { display: inline-block; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.rd-badge.rd-going { background: var(--live-soft); color: var(--live); }

/* Аватар-кружок (общий для всех вариантов) */
.av {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 10.5px; font-weight: 700; color: #fff; letter-spacing: -0.02em;
}

/* ============================================================
   ВАРИАНТ 0 — КАК СЕЙЧАС
   ============================================================ */
.now-layout { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; }
.now-stack { flex: 1 1 50%; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.now-btn {
  width: 100%; text-align: left; padding: 9px 12px; font-size: 13px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--hairline); color: var(--text);
  font-weight: 600; font-family: inherit; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.now-btn .c { font-size: 12px; font-weight: 700; opacity: 0.85; }
.now-btn.on { color: #fff; border-color: transparent; box-shadow: 0 2px 6px rgba(0,0,0,0.28); }
.now-btn.on.go { background: var(--vote-go); color: var(--on-accent); }
.now-btn.on.maybe { background: var(--vote-maybe); }
.now-btn.on.no { background: var(--vote-no); }
.now-donut {
  flex: 0 0 46%; aspect-ratio: 1/1; max-width: 168px; border-radius: 50%;
  position: relative; align-self: center;
}
.now-donut::after { content: ''; position: absolute; inset: 18px; border-radius: 50%; background: var(--bg); }
.now-num {
  position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap;
  background: var(--grad-num); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.now-num sup, .now-num sub { font-size: 0.78em; font-weight: 800; }
.now-num .sl { font-size: 1.25em; font-weight: 600; margin: 0 -1px; }

/* ============================================================
   ВАРИАНТ «НАША, ПОПРАВЛЕННАЯ» — та же композиция, что в проде,
   но круг ровно по высоте стопки кнопок + список откликнувшихся.
   ============================================================ */
.ours-layout { display: flex; gap: 14px; align-items: stretch; margin-bottom: 10px; }
.ours-stack { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
/* Высота кнопки фиксирована: 3 × 42 + 2 × 7 (gap) = 140 — ровно диаметр круга справа.
   Без фиксации диаметр пришлось бы выводить из содержимого, а это циклическая зависимость. */
.ours-btn {
  width: 100%; height: 42px; text-align: left; padding: 0 13px; border-radius: 13px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--hairline); color: var(--text);
  font-family: inherit; font-size: 13px; font-weight: 600;
  display: flex; align-items: center; gap: 9px;
}
.ours-btn .ico {
  width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; background: currentColor;
}
.ours-btn .ico svg { color: var(--bg); width: 11px; height: 11px; }
.ours-btn .lbl { flex: 1; color: var(--text); }
.ours-btn .cnt { font-size: 13px; font-weight: 800; letter-spacing: -0.02em; }
.ours-btn.go { color: var(--vote-go); }
.ours-btn.maybe { color: var(--vote-maybe); }
.ours-btn.no { color: var(--vote-no); }
.ours-btn.on { border-color: currentColor; background: var(--surface-2); box-shadow: inset 0 0 0 1px currentColor; }
/* Круг ровно по высоте стопки кнопок (140px = 3 кнопки по 42 + два зазора по 7). */
.ours-donut { flex: 0 0 140px; width: 140px; height: 140px; position: relative; }
.ours-donut svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
.ours-donut-in {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
}
.ours-num { font-size: 25px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; color: var(--text); }
.ours-num small { font-size: 0.52em; font-weight: 700; color: var(--text-faint); }
.ours-cap { font-size: 8.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-faint); }

/* ============================================================
   ВАРИАНТ R — РЕФЕРЕНС СО СКРИНШОТА, ПЕРЕСОБРАННЫЙ В НАШЕМ СТИЛЕ
   Композиция «трилистник»: кольцо сверху по центру, две боковые карточки,
   «Возможно» врезана снизу и огибает кольцо вырезом (CSS-маска).
   ============================================================ */
.m6-tri { position: relative; height: 208px; margin-bottom: 11px; }
/* Кольцо вписано в просвет между боковыми карточками (по 31% ширины) и равно им по высоте. */
.m6-ring { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 128px; height: 128px; }
.m6-ring svg { display: block; transform: rotate(-90deg); }
.m6-ring-txt {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding-bottom: 15px;
}
.m6-ring-txt b { font-size: 25px; font-weight: 800; letter-spacing: -0.035em; color: var(--text); line-height: 1; }
.m6-ring-txt i { font-style: normal; font-size: 11.5px; font-weight: 600; color: var(--text-faint); }
.m6-ring-cap {
  position: absolute; left: 0; right: 0; bottom: 32px; text-align: center;
  font-size: 8.5px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: var(--text-faint);
}
.m6-card {
  width: 100%; border-radius: 20px; cursor: pointer; font-family: inherit; position: relative; overflow: hidden;
  background: var(--glass-bg); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
  display: flex; align-items: center;
  transition: transform 0.14s ease;
}
/* Цветная полоса-подчёркивание по нижней кромке — как в референсе. */
.m6-card::after {
  content: ''; position: absolute; left: 14px; right: 14px; bottom: 0; height: 3px;
  border-radius: 3px 3px 0 0; background: currentColor; opacity: 0.4;
}
.m6-card.on { border-color: transparent; box-shadow: inset 0 0 0 1.5px currentColor; background: var(--surface-2); }
.m6-card.on::after { opacity: 1; height: 4px; }
.m6-card.go { color: var(--vote-go); }
.m6-card.maybe { color: var(--vote-maybe); }
.m6-card.no { color: var(--vote-no); }
/* Кружок-иконка залит цветом голоса (currentColor от карточки), сама иконка — цветом фона. */
.m6-ico {
  width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: currentColor;
}
.m6-ico svg { color: var(--bg); }
.m6-card.on .m6-ico { box-shadow: 0 3px 10px -1px currentColor; }
.m6-lbl { font-size: 13px; font-weight: 600; color: var(--text); }
.m6-num { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: currentColor; }

/* Боковые карточки — ровно той же высоты, что кольцо, и на одной с ним линии. */
.m6-side { position: absolute; top: 0; width: 31%; }
.m6-side.l { left: 0; }
.m6-side.r { right: 0; }
.m6-side .m6-card { height: 128px; flex-direction: column; justify-content: center; gap: 9px; padding: 12px 8px 14px; }

.m6-mid { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 52%; z-index: 2; }
.m6-mid .m6-card {
  height: 92px; justify-content: center; gap: 10px; padding: 24px 10px 14px;
  /* Вырез под кольцо: круг на 8px больше внешнего радиуса кольца (64px), центр совпадает
     с центром кольца — оно на 52px выше верхней кромки карточки, поэтому карточка заходит
     на кольцо снизу и обнимает его дугой. */
  -webkit-mask-image: radial-gradient(circle 72px at 50% -52px, transparent 0 71px, #000 72px);
          mask-image: radial-gradient(circle 72px at 50% -52px, transparent 0 71px, #000 72px);
}
.m6-mid .m6-num { font-size: 22px; }

/* Список участников с табами по статусу — вторая половина референса. */
.m6-seg {
  display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface);
  box-shadow: inset 2px 2px 6px var(--neu-hi), inset -2px -2px 6px var(--neu-lo);
  margin-bottom: 9px;
}
.m6-seg button {
  flex: 1; padding: 9px 4px; border: 0; border-radius: 11px; background: transparent;
  font-family: inherit; font-size: 11.5px; font-weight: 700; letter-spacing: -0.01em;
  color: var(--text-faint); cursor: pointer;
}
.m6-seg button.on { color: var(--text); background: var(--bg); box-shadow: -3px -3px 8px var(--neu-lo), 4px 4px 10px var(--neu-hi); }
.m6-list { padding: 6px; }
.m6-row { display: flex; align-items: center; gap: 9px; padding: 7px 8px; }
.m6-row + .m6-row { border-top: 1px solid var(--hairline); }
.m6-row .nm { font-size: 12.5px; color: var(--text); flex: 1; min-width: 0; }
.m6-row .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.m6-more { padding: 8px; font-size: 11.5px; color: var(--text-faint); text-align: center; }
.m6-empty { padding: 15px 14px; font-size: 12.5px; color: var(--text-dim); text-align: center; line-height: 1.45; }

/* ============================================================
   ВАРИАНТ 1 — ШКАЛА МЕСТ
   ============================================================ */
.m1-card { padding: 14px 15px 13px; margin-bottom: 10px; }
.m1-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-bottom: 11px; }
.m1-big { font-size: 27px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: var(--text); }
.m1-big em { font-style: normal; font-size: 14px; font-weight: 600; color: var(--text-faint); margin-left: 3px; }
.m1-cap { font-size: 11px; color: var(--text-faint); margin-top: 5px; letter-spacing: 0.02em; }
.m1-free { text-align: right; font-size: 12px; font-weight: 700; color: var(--accent); }
.m1-free.tight { color: var(--danger); }
.m1-free span { display: block; font-size: 10.5px; font-weight: 500; color: var(--text-faint); margin-top: 3px; letter-spacing: 0.02em; }
.m1-slots { display: flex; gap: 3px; height: 9px; margin-bottom: 11px; }
.m1-slot { flex: 1; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--hairline); }
.m1-slot.go { background: var(--vote-go); border-color: transparent; }
.m1-slot.me { background: var(--vote-go); border-color: transparent; box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--vote-go); }
.m1-slot.maybe { background: transparent; border: 1px dashed var(--vote-maybe); }
.m1-legend { display: flex; align-items: center; gap: 14px; font-size: 11px; color: var(--text-faint); }
.m1-legend i { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 5px; vertical-align: 0.5px; }
.m1-legend i.mb { background: transparent; border: 1px dashed var(--vote-maybe); }
.m1-legend i.nn { background: var(--vote-no); }
.m1-row { display: flex; gap: 7px; }
.m1-btn {
  flex: 1; padding: 11px 6px 10px; border-radius: 13px; cursor: pointer; font-family: inherit;
  background: var(--surface); border: 1px solid var(--hairline); color: var(--text);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 600; transition: transform 0.12s ease;
}
.m1-btn svg { opacity: 0.5; }
.m1-btn:active { transform: scale(0.97); }
.m1-btn.on { border-color: transparent; color: #fff; }
.m1-btn.on svg { opacity: 1; }
.m1-btn.on.go { background: var(--vote-go); color: var(--on-accent); box-shadow: 0 3px 10px var(--accent-shadow); }
.m1-btn.on.maybe { background: var(--vote-maybe); box-shadow: 0 3px 10px rgba(142,93,255,0.3); }
.m1-btn.on.no { background: var(--vote-no); }

/* ============================================================
   ВАРИАНТ 2 — ПЛИТКИ + КОЛЬЦО (по референсу)
   ============================================================ */
.m2-ring-wrap { display: flex; justify-content: center; margin-bottom: 14px; }
.m2-ring { width: 124px; height: 124px; border-radius: 50%; position: relative; }
.m2-ring::after { content: ''; position: absolute; inset: 13px; border-radius: 50%; background: var(--bg); }
.m2-ring-in {
  position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
}
.m2-ring-num {
  font-size: 25px; font-weight: 800; letter-spacing: -0.03em; line-height: 1;
  background: var(--grad-num); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.m2-ring-num small { font-size: 0.62em; font-weight: 700; }
.m2-ring-cap { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-faint); }
.m2-tiles { display: flex; gap: 8px; }
.m2-tile {
  flex: 1; padding: 12px 6px 11px; border-radius: 16px; cursor: pointer; font-family: inherit;
  background: var(--surface); border: 1px solid var(--hairline); color: var(--text);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  position: relative; transition: transform 0.14s ease, box-shadow 0.14s ease;
}
.m2-ico {
  width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: var(--surface-2); border: 1px solid var(--hairline-2); color: var(--text-faint);
}
.m2-tile .lbl { font-size: 11.5px; font-weight: 600; color: var(--text-dim); }
.m2-tile .num { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.m2-tile.on { transform: translateY(-3px); border-color: transparent; }
.m2-tile.on .lbl, .m2-tile.on .num { color: #fff; }
.m2-tile.on .m2-ico { background: rgba(255,255,255,0.22); border-color: transparent; color: #fff; }
.m2-tile.on.go { background: var(--vote-go); box-shadow: 0 6px 16px var(--accent-shadow); }
.m2-tile.on.go .lbl, .m2-tile.on.go .num { color: var(--on-accent); }
.m2-tile.on.go .m2-ico { color: var(--on-accent); }
.m2-tile.on.maybe { background: var(--vote-maybe); box-shadow: 0 6px 16px rgba(142,93,255,0.32); }
.m2-tile.on.no { background: var(--vote-no); box-shadow: 0 6px 16px rgba(0,0,0,0.28); }

/* ============================================================
   ВАРИАНТ 3 — ОДНО РЕШЕНИЕ (главный CTA)
   ============================================================ */
.m3-status { padding: 12px 15px; margin-bottom: 12px; }
.m3-line { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
.m3-t { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
.m3-t b { color: var(--accent); }
.m3-s { font-size: 11.5px; color: var(--text-faint); }
.m3-bar { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: flex; }
.m3-bar .fill { background: var(--accent-grad); border-radius: 3px; }
.m3-bar .soft { background: repeating-linear-gradient(135deg, rgba(142,93,255,0.55) 0 3px, transparent 3px 6px); }
.m3-cta {
  width: 100%; background: var(--cta-grad); color: var(--on-accent); border: 0;
  padding: 15px 20px; border-radius: 14px; font-size: 14.5px; font-weight: 700;
  cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 9px;
  box-shadow: 0 4px 10px var(--accent-shadow), 0 8px 18px var(--accent-shadow-soft), inset 0 1px 0 rgba(255,255,255,0.25);
}
.m3-alt { display: flex; gap: 8px; margin-top: 9px; }
.m3-alt button {
  flex: 1; padding: 11px; border-radius: 12px; background: transparent;
  border: 1px solid var(--hairline-2); color: var(--text-dim);
  font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.m3-alt button.on { background: var(--surface-2); color: var(--text); border-color: var(--vote-maybe); }
.m3-alt button.on.no { border-color: var(--vote-no); }
.m3-done {
  display: flex; align-items: center; gap: 11px; padding: 13px 15px; border-radius: 16px;
  background: var(--live-soft); border: 1px solid transparent;
}
.m3-done .tick {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; color: #fff;
  background: var(--live);
}
.m3-done .txt { flex: 1; min-width: 0; }
.m3-done .txt b { display: block; font-size: 13.5px; font-weight: 700; color: var(--text); }
.m3-done .txt span { font-size: 11.5px; color: var(--text-dim); }
.m3-done .chg {
  background: transparent; border: 0; font-family: inherit; cursor: pointer;
  font-size: 12px; font-weight: 600; color: var(--accent); padding: 4px 2px;
}

/* ============================================================
   ВАРИАНТ 4 — ЛЮДИ ВПЕРЁД
   ============================================================ */
.m4-people { display: flex; align-items: center; gap: 11px; margin-bottom: 12px; }
.m4-stack { display: flex; }
.m4-stack .av { border: 2px solid var(--bg); width: 32px; height: 32px; }
.m4-stack .av + .av { margin-left: -11px; }
.m4-stack .more {
  background: var(--surface-2); color: var(--text-dim); border: 2px solid var(--bg);
  font-size: 10.5px; font-weight: 700;
}
.m4-say { font-size: 12.5px; color: var(--text-dim); line-height: 1.4; flex: 1; min-width: 0; }
.m4-say b { color: var(--text); font-weight: 600; }
.m4-meter { margin-bottom: 13px; }
.m4-meter-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; color: var(--text-faint); margin-bottom: 6px; }
.m4-meter-top b { font-size: 13px; font-weight: 700; color: var(--text); }
.m4-track { height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.m4-track .fill { height: 100%; background: var(--accent-grad); border-radius: 4px; }
.m4-seg {
  display: flex; gap: 5px; padding: 5px; border-radius: 16px; background: var(--surface);
  box-shadow: inset 2px 2px 6px var(--neu-hi), inset -2px -2px 6px var(--neu-lo);
  margin-bottom: 9px;
}
.m4-seg button {
  flex: 1; padding: 10px 4px; border: 0; border-radius: 12px; background: transparent;
  font-family: inherit; font-size: 12.5px; font-weight: 700; letter-spacing: -0.01em;
  color: var(--text-faint); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.m4-seg button.on { color: var(--text); background: var(--bg); box-shadow: -3px -3px 8px var(--neu-lo), 4px 4px 10px var(--neu-hi); }
.m4-seg button.on.go { color: var(--vote-go); }
.m4-seg button.on.maybe { color: var(--vote-maybe); }
.m4-sub { font-size: 11.5px; color: var(--text-faint); padding-left: 2px; }
.m4-sub i { font-style: normal; color: var(--text-dim); font-weight: 600; }

/* ============================================================
   ВАРИАНТ 5 — ТАБЛО (всё в одной карточке)
   ============================================================ */
.m5-card { overflow: hidden; }
.m5-head { display: flex; align-items: center; gap: 14px; padding: 15px 16px 14px; }
.m5-count { min-width: 0; }
.m5-count .n {
  font-size: 30px; font-weight: 800; letter-spacing: -0.035em; line-height: 1;
  background: var(--grad-num); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.m5-count .n small { font-size: 0.5em; font-weight: 700; letter-spacing: 0; }
.m5-count .c { font-size: 11px; color: var(--text-faint); margin-top: 5px; letter-spacing: 0.03em; }
.m5-bars { flex: 1; display: flex; align-items: flex-end; justify-content: flex-end; gap: 9px; height: 56px; }
.m5-bar { width: 30px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.m5-bar .v { font-size: 11.5px; font-weight: 700; color: var(--text-dim); }
.m5-bar .b { width: 100%; border-radius: 4px 4px 2px 2px; min-height: 3px; }
.m5-bar .k { font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); }
.m5-bar.go .b { background: var(--vote-go); }
.m5-bar.maybe .b { background: var(--vote-maybe); }
.m5-bar.no .b { background: var(--vote-no); }
.m5-actions { display: flex; gap: 6px; padding: 10px 10px 11px; border-top: 1px solid var(--hairline); }
.m5-actions button {
  flex: 1; padding: 11px 4px; border-radius: 12px; cursor: pointer; font-family: inherit;
  background: transparent; border: 1px solid var(--hairline-2); color: var(--text-dim);
  font-size: 12.5px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.m5-actions button.on { border-color: transparent; }
.m5-actions button.on.go { background: var(--vote-go); color: var(--on-accent); }
.m5-actions button.on.maybe { background: var(--vote-maybe); color: #fff; }
.m5-actions button.on.no { background: var(--vote-no); color: #fff; }
.m5-foot {
  display: flex; align-items: center; gap: 8px; padding: 10px 16px 12px;
  border-top: 1px solid var(--hairline); font-size: 11.5px; color: var(--text-faint);
}
.m5-foot svg { flex-shrink: 0; opacity: 0.7; }
</style>
</head>
<body>

<div class="lab-bar">
  <div class="lab-title">Событие · блок «Набор»<span>текущий + 7 вариантов · кликабельно</span></div>
  <div class="lab-group">
    <label>Данные</label>
    <button class="lab-btn" data-preset="empty">пусто</button>
    <button class="lab-btn on" data-preset="mid">12 из 20</button>
    <button class="lab-btn" data-preset="full">почти полно</button>
    <button class="lab-btn" data-preset="open">открытая</button>
  </div>
  <div class="lab-group">
    <label>Палитра</label>
    <button class="lab-btn on" data-palette-set="brand">наша</button>
    <button class="lab-btn" data-palette-set="traffic">светофор</button>
  </div>
  <div class="lab-group">
    <label>Тема</label>
    <button class="lab-btn on" data-theme-set="dark">тёмная</button>
    <button class="lab-btn" data-theme-set="light">светлая</button>
  </div>
</div>

<div class="lab-hint">
  Кликай по кнопкам голоса внутри любого макета — счётчики и шкалы пересчитываются вживую, как в приложении.
  <b>Ваш голос</b> добавляется к счётчику. Показан только Этап&nbsp;1 («Набор»), где голос — это интерес, а не бронь места.
</div>

<div class="grid" id="grid"></div>

<script>
/* ------------------------------------------------------------------
   Состояние мокапа: базовые счётчики (без моего голоса) + мой голос.
   ------------------------------------------------------------------ */
const PRESETS = {
  empty: { limit: 20, going: 0,  maybe: 0, no: 0, open: false },
  mid:   { limit: 20, going: 12, maybe: 5, no: 2, open: false },
  full:  { limit: 12, going: 11, maybe: 4, no: 1, open: false },
  open:  { limit: 0,  going: 9,  maybe: 3, no: 1, open: true  },
};
const state = { preset: 'mid', myVote: null, tab: 'going' };

/* Имена для аватаров и ростера. */
const PEOPLE = [
  ['Аня К.',   'АК', 'linear-gradient(135deg,#FFA070,#F47B3C)'],
  ['Игорь М.', 'ИМ', 'linear-gradient(135deg,#8E5DFF,#5B34C4)'],
  ['Лиза П.',  'ЛП', 'linear-gradient(135deg,#66D49A,#2E7D5A)'],
  ['Тимур А.', 'ТА', 'linear-gradient(135deg,#FF8BA0,#E84C9A)'],
  ['Даша В.',  'ДВ', 'linear-gradient(135deg,#8FC7E8,#3B82A6)'],
  ['Олег Р.',  'ОР', 'linear-gradient(135deg,#FFD08A,#D5611C)'],
];

/* Производные данные: счётчики с учётом моего голоса. */
function derive() {
  const p = PRESETS[state.preset];
  const mv = state.myVote;
  const going = p.going + (mv === 'going' ? 1 : 0);
  const maybe = p.maybe + (mv === 'maybe' ? 1 : 0);
  const no    = p.no    + (mv === 'no'    ? 1 : 0);
  const limit = p.limit;
  const open  = p.open;
  const free  = open ? null : Math.max(limit - going, 0);
  const pct   = open ? (going > 0 ? 100 : 0) : Math.min(going / (limit || 1), 1) * 100;
  return { going, maybe, no, limit, open, free, pct, myVote: mv };
}

/* Склонение: 12 мест / 1 место / 3 места */
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

const ICO = {
  check: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  q:     '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>',
  x:     '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  clock: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
};

const btn = (vote, on) => `data-vote="${vote}"${on ? ' class-on' : ''}`;
const isOn = (d, v) => d.myVote === v;

/* ---------- 0. Как сейчас ---------- */
function vNow(d) {
  const total = d.going + d.maybe + d.no;
  const ring = total === 0
    ? 'var(--surface-2)'
    : `conic-gradient(var(--vote-go) 0 ${d.going/total*360}deg, var(--vote-maybe) ${d.going/total*360}deg ${(d.going+d.maybe)/total*360}deg, var(--vote-no) ${(d.going+d.maybe)/total*360}deg 360deg)`;
  return `
  <div class="rd-section-sub-h">Набор · ${d.going}${d.open ? '' : ' / ' + d.limit}</div>
  <div class="now-layout">
    <div class="now-stack">
      <button class="now-btn go${isOn(d,'going')?' on':''}" data-vote="going">Пойду <span class="c">${d.going}</span></button>
      <button class="now-btn maybe${isOn(d,'maybe')?' on':''}" data-vote="maybe">Возможно <span class="c">${d.maybe}</span></button>
      <button class="now-btn no${isOn(d,'no')?' on':''}" data-vote="no">Не пойду <span class="c">${d.no}</span></button>
    </div>
    <div class="now-donut" style="background:${ring}">
      <div class="now-num"><sup>${d.going}</sup>${d.open ? '' : '<span class="sl">/</span><sub>'+d.limit+'</sub>'}</div>
    </div>
  </div>
  ${d.myVote ? `<div style="margin:10px 0 8px"><span class="rd-badge rd-going">Ваш голос: ${{going:'Пойду',maybe:'Возможно',no:'Не пойду'}[d.myVote]}</span></div>` : '<div style="height:8px"></div>'}
  <div class="rd-hint">Подтверждение мест откроется за 18 часов до начала</div>`;
}

/* ---------- R. Референс со скриншота в нашем стиле ---------- */
function vRef(d) {
  /* Кольцо — SVG со скруглёнными концами дуги (как на скриншоте); считает ровно одно:
     сколько мест занято. */
  const R = 57, C = 2 * Math.PI * R;
  const dash = d.open ? C : C * Math.min(d.going / (d.limit || 1), 1);
  const ring = `
    <svg width="128" height="128" viewBox="0 0 128 128">
      <circle cx="64" cy="64" r="${R}" fill="none" stroke="var(--ring-track)" stroke-width="11"/>
      ${dash > 0 ? `<circle cx="64" cy="64" r="${R}" fill="none" stroke="var(--vote-go)" stroke-width="11"
        stroke-linecap="round" stroke-dasharray="${dash} ${C}"/>` : ''}
    </svg>`;

  return `
  <div class="rd-section-sub-h">Набор</div>
  <div class="m6-tri">
    <div class="m6-ring">
      ${ring}
      <div class="m6-ring-txt"><b>${d.going}</b>${d.open ? '' : `<i>из ${d.limit}</i>`}</div>
      <div class="m6-ring-cap">${d.open ? 'идут' : 'мест занято'}</div>
    </div>
    <div class="m6-side l">
      <button class="m6-card go${isOn(d,'going')?' on':''}" data-vote="going">
        <span class="m6-ico">${ICO.check}</span>
        <span class="m6-lbl">Пойду</span>
        <span class="m6-num">${d.going}</span>
      </button>
    </div>
    <div class="m6-side r">
      <button class="m6-card no${isOn(d,'no')?' on':''}" data-vote="no">
        <span class="m6-ico">${ICO.x}</span>
        <span class="m6-lbl">Не пойду</span>
        <span class="m6-num">${d.no}</span>
      </button>
    </div>
    <div class="m6-mid">
      <button class="m6-card maybe${isOn(d,'maybe')?' on':''}" data-vote="maybe">
        <span class="m6-ico">${ICO.q}</span>
        <span class="m6-lbl">Возможно</span>
        <span class="m6-num">${d.maybe}</span>
      </button>
    </div>
  </div>
  <div class="rd-hint" style="margin-bottom:16px">Подтверждение мест откроется за 18 часов до начала</div>
  ${respondersBlock(d)}`;
}

/* ---------- Общий блок «кто откликнулся»: табы по статусу + список ----------
   Заменяет нынешние «Предварительные голоса», где видны только идущие: «возможно» и «не иду»
   сейчас считаются в счётчиках, но лиц за ними нет. */
function respondersBlock(d) {
  const tabs = [
    ['going', 'Идут', d.going, 'var(--vote-go)'],
    ['maybe', 'Возможно', d.maybe, 'var(--vote-maybe)'],
    ['no', 'Не идут', d.no, 'var(--vote-no)'],
  ];
  const active = tabs.find(t => t[0] === state.tab) ?? tabs[0];
  const count = active[2];
  let list;
  if (count === 0) {
    list = `<div class="m6-empty">${active[0] === 'going'
      ? 'Пока никто не откликнулся. Проголосуй первым — остальным будет проще решиться.'
      : 'Здесь пока пусто.'}</div>`;
  } else {
    const shown = Math.min(count, 3);
    const off = active[0] === 'maybe' ? 2 : active[0] === 'no' ? 4 : 0;
    let rows = '';
    for (let i = 0; i < shown; i++) {
      const p = PEOPLE[(i + off) % PEOPLE.length];
      const me = d.myVote === active[0] && i === 0;
      rows += `<div class="m6-row">
        <span class="av" style="background:${me ? 'var(--accent-grad)' : p[2]};${me ? 'color:var(--on-accent)' : ''}">${me ? 'Вы' : p[1]}</span>
        <span class="nm">${me ? 'Вы' : p[0]}</span>
        <span class="dot" style="background:${active[3]}"></span>
      </div>`;
    }
    if (count > shown) rows += `<div class="m6-more">и ещё ${count - shown}</div>`;
    list = rows;
  }
  return `
  <div class="rd-section-sub-h">Кто откликнулся</div>
  <div class="m6-seg">
    ${tabs.map(t => `<button class="${state.tab === t[0] ? 'on' : ''}" data-tab="${t[0]}">${t[1]} (${t[2]})</button>`).join('')}
  </div>
  <div class="rd-glass m6-list">${list}</div>`;
}

/* ---------- Наша композиция, поправленная ---------- */
function vOurs(d) {
  const R = 57, C = 2 * Math.PI * R;
  const dash = d.open ? C : C * Math.min(d.going / (d.limit || 1), 1);
  const row = (vote, cls, ico, label, value) => `
    <button class="ours-btn ${cls}${isOn(d, vote) ? ' on' : ''}" data-vote="${vote}">
      <span class="ico">${ico}</span><span class="lbl">${label}</span><span class="cnt">${value}</span>
    </button>`;
  return `
  <div class="rd-section-sub-h">Набор · ${d.going}${d.open ? '' : ' / ' + d.limit}</div>
  <div class="ours-layout">
    <div class="ours-stack">
      ${row('going', 'go', ICO.check, 'Пойду', d.going)}
      ${row('maybe', 'maybe', ICO.q, 'Возможно', d.maybe)}
      ${row('no', 'no', ICO.x, 'Не пойду', d.no)}
    </div>
    <div class="ours-donut">
      <svg viewBox="0 0 128 128">
        <circle cx="64" cy="64" r="${R}" fill="none" stroke="var(--ring-track)" stroke-width="11"/>
        ${dash > 0 ? `<circle cx="64" cy="64" r="${R}" fill="none" stroke="var(--vote-go)" stroke-width="11"
          stroke-linecap="round" stroke-dasharray="${dash} ${C}"/>` : ''}
      </svg>
      <div class="ours-donut-in">
        <div class="ours-num">${d.going}${d.open ? '' : `<small> / ${d.limit}</small>`}</div>
        <div class="ours-cap">${d.open ? 'идут' : 'мест занято'}</div>
      </div>
    </div>
  </div>
  <div class="rd-hint" style="margin-bottom:16px">Подтверждение мест откроется за 18 часов до начала</div>
  ${respondersBlock(d)}`;
}

/* ---------- 1. Шкала мест ---------- */
function v1(d) {
  let slots = '';
  if (!d.open) {
    const shown = Math.min(d.limit, 24);
    const maybeShown = Math.min(d.maybe, Math.max(shown - d.going, 0));
    for (let i = 0; i < shown; i++) {
      let cls = 'm1-slot';
      if (i < d.going) cls += (d.myVote === 'going' && i === d.going - 1) ? ' me' : ' go';
      else if (i < d.going + maybeShown) cls += ' maybe';
      slots += `<div class="${cls}"></div>`;
    }
  }
  const tight = !d.open && d.free <= 3;
  return `
  <div class="rd-section-sub-h">Набор</div>
  <div class="rd-glass m1-card">
    <div class="m1-top">
      <div>
        <div class="m1-big">${d.going}${d.open ? '' : `<em>/ ${d.limit}</em>`}</div>
        <div class="m1-cap">${d.open ? 'идут на встречу' : 'мест занято'}</div>
      </div>
      ${d.open
        ? `<div class="m1-free" style="color:var(--live)">без лимита<span>места не кончатся</span></div>`
        : `<div class="m1-free${tight ? ' tight' : ''}">${d.free === 0 ? 'мест нет' : d.free + ' ' + plural(d.free,'место','места','мест')}<span>${d.free === 0 ? 'дальше — лист ожидания' : 'свободно'}</span></div>`}
    </div>
    ${d.open ? '' : `<div class="m1-slots">${slots}</div>`}
    <div class="m1-legend">
      <span><i style="background:var(--vote-go)"></i>идут ${d.going}</span>
      <span><i class="mb"></i>возможно ${d.maybe}</span>
      <span><i class="nn"></i>не идут ${d.no}</span>
    </div>
  </div>
  <div class="m1-row">
    <button class="m1-btn go${isOn(d,'going')?' on':''}" data-vote="going">${ICO.check}Иду</button>
    <button class="m1-btn maybe${isOn(d,'maybe')?' on':''}" data-vote="maybe">${ICO.q}Возможно</button>
    <button class="m1-btn no${isOn(d,'no')?' on':''}" data-vote="no">${ICO.x}Не иду</button>
  </div>
  <div class="rd-hint" style="margin-top:10px">Подтверждение мест откроется за 18 часов до начала</div>`;
}

/* ---------- 2. Плитки + кольцо (референс) ---------- */
function v2(d) {
  const deg = d.pct / 100 * 360;
  const ring = d.going === 0
    ? 'var(--surface-2)'
    : `conic-gradient(var(--vote-go) 0 ${deg}deg, var(--surface-2) ${deg}deg 360deg)`;
  return `
  <div class="rd-section-sub-h">Набор</div>
  <div class="m2-ring-wrap">
    <div class="m2-ring" style="background:${ring}">
      <div class="m2-ring-in">
        <div class="m2-ring-num">${d.going}${d.open ? '' : `<small> / ${d.limit}</small>`}</div>
        <div class="m2-ring-cap">${d.open ? 'идут' : 'мест занято'}</div>
      </div>
    </div>
  </div>
  <div class="m2-tiles">
    <button class="m2-tile go${isOn(d,'going')?' on':''}" data-vote="going">
      <span class="m2-ico">${ICO.check}</span><span class="lbl">Иду</span><span class="num">${d.going}</span>
    </button>
    <button class="m2-tile maybe${isOn(d,'maybe')?' on':''}" data-vote="maybe">
      <span class="m2-ico">${ICO.q}</span><span class="lbl">Возможно</span><span class="num">${d.maybe}</span>
    </button>
    <button class="m2-tile no${isOn(d,'no')?' on':''}" data-vote="no">
      <span class="m2-ico">${ICO.x}</span><span class="lbl">Не иду</span><span class="num">${d.no}</span>
    </button>
  </div>
  <div class="rd-hint" style="margin-top:12px">Подтверждение мест откроется за 18 часов до начала</div>`;
}

/* ---------- 3. Одно решение ---------- */
function v3(d) {
  const maybeW = d.open ? 0 : Math.min(d.maybe / (d.limit || 1) * 100, 100 - d.pct);
  const head = d.open
    ? `<div class="m3-t">Идут <b>${d.going}</b></div><div class="m3-s">мест не ограничено</div>`
    : (d.free === 0
        ? `<div class="m3-t">Мест <b>не осталось</b></div><div class="m3-s">${d.going} из ${d.limit} · дальше лист ожидания</div>`
        : `<div class="m3-t">Осталось <b>${d.free}</b> ${plural(d.free,'место','места','мест')}</div><div class="m3-s">${d.going} из ${d.limit}</div>`);
  const action = d.myVote === 'going'
    ? `<div class="m3-done">
         <span class="tick">${ICO.check}</span>
         <span class="txt"><b>Вы идёте</b><span>${d.open ? 'встреча открытая' : 'место закрепится на этапе подтверждения'}</span></span>
         <button class="chg" data-vote="clear">Изменить</button>
       </div>`
    : `<button class="m3-cta" data-vote="going">${ICO.check} Иду</button>
       <div class="m3-alt">
         <button class="maybe${isOn(d,'maybe')?' on':''}" data-vote="maybe">Возможно</button>
         <button class="no${isOn(d,'no')?' on':''}" data-vote="no">Не пойду</button>
       </div>`;
  return `
  <div class="rd-section-sub-h">Набор</div>
  <div class="rd-glass m3-status">
    <div class="m3-line">${head}</div>
    <div class="m3-bar">
      <div class="fill" style="width:${d.pct}%"></div>
      <div class="soft" style="width:${maybeW}%"></div>
    </div>
  </div>
  ${action}
  <div class="rd-hint" style="margin-top:11px">${d.maybe ? `${d.maybe} под вопросом · ` : ''}${d.no ? `${d.no} отказались · ` : ''}подтверждение мест за 18 ч до начала</div>`;
}

/* ---------- 4. Люди вперёд ---------- */
function v4(d) {
  const n = Math.min(d.going, 4);
  const mine = d.myVote === 'going'
    ? `<span class="av" style="background:var(--accent-grad);color:var(--on-accent)">Вы</span>`
    : '';
  const faces = mine + PEOPLE.slice(0, mine ? n - 1 : n).map(p => `<span class="av" style="background:${p[2]}">${p[1]}</span>`).join('');
  const more = d.going > n ? `<span class="av more">+${d.going - n}</span>` : '';
  const say = d.going === 0
    ? 'Пока никто не откликнулся — проголосуй первым'
    : (d.myVote === 'going'
        ? `<b>Вы</b>, ${PEOPLE[0][0].split(' ')[0]}${d.going > 2 ? ` и ещё ${d.going - 2}` : ''} идут`
        : `<b>${PEOPLE[0][0].split(' ')[0]}</b>, ${PEOPLE[1][0].split(' ')[0]}${d.going > 2 ? ` и ещё ${d.going - 2}` : ''} идут`);
  return `
  <div class="rd-section-sub-h">Набор</div>
  <div class="m4-people">
    ${d.going > 0 ? `<div class="m4-stack">${faces}${more}</div>` : ''}
    <div class="m4-say">${say}</div>
  </div>
  <div class="m4-meter">
    <div class="m4-meter-top">
      <span><b>${d.going}</b>${d.open ? ' идут' : ` из ${d.limit}`}</span>
      <span>${d.open ? 'без лимита' : (d.free === 0 ? 'мест нет' : `свободно ${d.free}`)}</span>
    </div>
    <div class="m4-track"><div class="fill" style="width:${d.pct}%"></div></div>
  </div>
  <div class="m4-seg">
    <button class="go${isOn(d,'going')?' on':''}" data-vote="going">${ICO.check} Иду</button>
    <button class="maybe${isOn(d,'maybe')?' on':''}" data-vote="maybe">${ICO.q} Возможно</button>
    <button class="no${isOn(d,'no')?' on':''}" data-vote="no">${ICO.x} Не иду</button>
  </div>
  <div class="m4-sub">${d.maybe ? `<i>${d.maybe}</i> под вопросом · ` : ''}${d.no ? `<i>${d.no}</i> не идут · ` : ''}подтверждение за 18 ч</div>`;
}

/* ---------- 5. Табло ---------- */
function v5(d) {
  const max = Math.max(d.going, d.maybe, d.no, 1);
  const bar = (cls, val, key) =>
    `<div class="m5-bar ${cls}"><span class="v">${val}</span><span class="b" style="height:${Math.round(val / max * 34) + 3}px"></span><span class="k">${key}</span></div>`;
  return `
  <div class="rd-section-sub-h">Набор</div>
  <div class="rd-glass m5-card">
    <div class="m5-head">
      <div class="m5-count">
        <div class="n">${d.going}${d.open ? '' : `<small> / ${d.limit}</small>`}</div>
        <div class="c">${d.open ? 'идут' : (d.free === 0 ? 'мест нет' : `свободно ${d.free}`)}</div>
      </div>
      <div class="m5-bars">
        ${bar('go', d.going, 'иду')}
        ${bar('maybe', d.maybe, 'возм.')}
        ${bar('no', d.no, 'нет')}
      </div>
    </div>
    <div class="m5-actions">
      <button class="go${isOn(d,'going')?' on':''}" data-vote="going">${ICO.check} Иду</button>
      <button class="maybe${isOn(d,'maybe')?' on':''}" data-vote="maybe">${ICO.q} Возможно</button>
      <button class="no${isOn(d,'no')?' on':''}" data-vote="no">${ICO.x} Не иду</button>
    </div>
    <div class="m5-foot">${ICO.clock} Подтверждение мест — за 18 ч до начала</div>
  </div>`;
}

/* ------------------------------------------------------------------
   Мета вариантов + сборка сетки
   ------------------------------------------------------------------ */
const VARIANTS = [
  { id: 'now', num: '0', name: 'Как сейчас', idea: 'Кольцо (доли голосов) + число (заполненность мест) + три кнопки-строки.', render: vNow, now: true,
    pros: [['m','Кольцо и число внутри него означают разное — мозг склеивает их в одно'],['m','Самый высокий блок после кольца-варианта'],['m','Счётчики продублированы: и в кнопках, и в кольце']] },
  { id: 'ours', num: '★', name: 'Наша, поправленная', idea: 'Та же композиция, что в проде, с правками: круг ровно по высоте стопки кнопок, дуга считает только занятость мест, у кнопок появились цветные метки-иконки. Снизу — список откликнувшихся с табами по статусу.', render: vOurs,
    pros: [['p','Круг и кнопки в одной высоте — блок стал прямоугольным, без «торчащего» круга'],['p','Дуга и число внутри неё теперь про одно и то же — занятость мест'],['p','Табы показывают и тех, кто «возможно» и «не идёт» — сейчас их лиц не видно нигде'],['m','Список добавляет высоты: +150px к блоку']] },
  { id: 'ref', num: 'R', name: 'Референс со скриншота', idea: 'Твой референс, пересобранный нашими материалами: стеклянные карточки, наша палитра голосования, кольцо считает занятость мест, «Возможно» огибает кольцо вырезом. Плюс вторая половина референса — список откликнувшихся с табами по статусу.', render: vRef,
    pros: [['p','Знакомая композиция: три варианта ответа читаются за секунду'],['p','Табы «Идут / Возможно / Не идут» показывают всех откликнувшихся, а не только идущих'],['m','Самый высокий блок: карточки + список занимают почти весь первый экран'],['m','Вырез под кольцо — нестандартная форма, единственная такая в приложении']] },
  { id: 'm1', num: '1', name: 'Шкала мест', idea: 'Метафора «стадион»: 20 делений = 20 мест. Занятые — сплошные, «возможно» — пунктиром как потенциальные.', render: v1,
    pros: [['p','Дефицит мест виден физически, а не как число'],['p','«Возможно» честно показано как «может занять место»'],['p','−60px высоты против текущего'],['m','Работает до ~24 мест; больше — надо схлопывать в сплошную полосу']] },
  { id: 'm2', num: '2', name: 'Плитки + кольцо', idea: 'Прямая адаптация присланного референса под нашу палитру. Кольцо считает ровно одно — занятость мест.', render: v2,
    pros: [['p','Три равных плитки читаются мгновенно, привычный паттерн'],['p','Кольцо перестало смешивать два смысла'],['m','Самый высокий блок из всех — кольцо съедает экран'],['m','«Не иду» визуально равен «Иду», хотя ценность действий разная']] },
  { id: 'm3', num: '3', name: 'Одно решение', idea: 'Иерархия по важности: «Иду» — главная кнопка, остальное — вторично. После голоса кнопка превращается в статус.', render: v3,
    pros: [['p','Самый низкий порог: одно очевидное действие'],['p','После голоса блок сжимается в строку статуса'],['p','Дефицит мест словами: «осталось 3 места»'],['m','Счётчики «возможно/не иду» уезжают в мелкий текст']] },
  { id: 'm4', num: '4', name: 'Люди вперёд', idea: 'Соцдоказательство впереди цифр: сначала лица тех, кто идёт, потом шкала и переключатель.', render: v4,
    pros: [['p','«Идут Аня и ещё 10» мотивирует сильнее, чем «12/20»'],['p','Переключатель — уже существующий .rd-seg, новых сущностей ноль'],['m','Сегмент-контрол читается как фильтр, а не как голос'],['m','Аватары дублируют список «Предварительные голоса» ниже']] },
  { id: 'm5', num: '5', name: 'Табло', idea: 'Один самодостаточный виджет: счёт, столбики голосов, кнопки и сноска про Этап 2 — внутри одной карточки.', render: v5,
    pros: [['p','Всё про набор — в одной рамке, страница перестаёт рассыпаться'],['p','Столбики дают пропорцию голосов без кольца'],['p','Та же карточка переиспользуется на Этапе 2 (состав)'],['m','Столбики при 0 голосов выглядят пустовато']] },
];

function build() {
  document.getElementById('grid').innerHTML = VARIANTS.map(v => `
    <section class="col${v.now ? ' is-now' : ''}" data-id="${v.id}">
      <div class="col-head">
        <div><span class="col-num">${v.num}</span><span class="col-name">${v.name}</span></div>
        <div class="col-idea">${v.idea}</div>
      </div>
      <div class="phone" data-render="${v.id}"></div>
      <div class="h-badge">высота блока: <b data-h="${v.id}">—</b></div>
      <ul class="pros">${v.pros.map(p => `<li class="${p[0]}">${p[1]}</li>`).join('')}</ul>
    </section>`).join('');
}

function renderAll() {
  const d = derive();
  VARIANTS.forEach(v => {
    const host = document.querySelector(`[data-render="${v.id}"]`);
    host.innerHTML = v.render(d);
    document.querySelector(`[data-h="${v.id}"]`).textContent = Math.round(host.getBoundingClientRect().height - 32) + ' px';
  });
}

document.addEventListener('click', (e) => {
  const voteEl = e.target.closest('[data-vote]');
  if (voteEl) {
    const v = voteEl.dataset.vote;
    state.myVote = (v === 'clear' || state.myVote === v) ? null : v;
    renderAll();
    return;
  }
  const tabEl = e.target.closest('[data-tab]');
  if (tabEl) {
    state.tab = tabEl.dataset.tab;
    renderAll();
    return;
  }
  const paletteEl = e.target.closest('[data-palette-set]');
  if (paletteEl) {
    document.documentElement.dataset.palette = paletteEl.dataset.paletteSet;
    document.querySelectorAll('[data-palette-set]').forEach(b => b.classList.toggle('on', b === paletteEl));
    renderAll();
    return;
  }
  const presetEl = e.target.closest('[data-preset]');
  if (presetEl) {
    state.preset = presetEl.dataset.preset;
    state.myVote = null;
    document.querySelectorAll('[data-preset]').forEach(b => b.classList.toggle('on', b === presetEl));
    renderAll();
    return;
  }
  const themeEl = e.target.closest('[data-theme-set]');
  if (themeEl) {
    document.documentElement.dataset.theme = themeEl.dataset.themeSet;
    document.querySelectorAll('[data-theme-set]').forEach(b => b.classList.toggle('on', b === themeEl));
    renderAll();
  }
});

build();
renderAll();
</script>
</body>
</html>
