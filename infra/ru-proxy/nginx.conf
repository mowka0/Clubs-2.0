# nginx на российском VPS: L4-труба (TCP passthrough) до Hetzner. TLS здесь не терминируется —
# сертификат, роутинг Traefik и само приложение остаются на Hetzner. Зачем и как ставить — README.md.
user www-data;
worker_processes auto;
# Stream-сессия держит два дескриптора (клиент + upstream); юнит nginx в Ubuntu лимит не
# поднимает, воркер наследует 1024 — 4096 соединений без этой строки упёрлись бы в EMFILE.
worker_rlimit_nofile 8192;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
# Ubuntu собирает stream отдельным модулем (пакет libnginx-mod-stream), подключается отсюда.
include /etc/nginx/modules-enabled/*.conf;

events {
    # Запас на порядок выше нынешней аудитории; потолок задаёт worker_rlimit_nofile (2 fd на сессию).
    worker_connections 4096;
}

# Блока http намеренно нет: прокси ничего не отдаёт сам, только пробрасывает соединения.
stream {
    # Для tcpdump/conntrack на Hetzner клиент — этот VPS; здесь адрес клиента пишется явно,
    # для сверки с логом фронта (его последнее поле X-Forwarded-For — тот же адрес).
    log_format proxy '$remote_addr [$time_local] $protocol $status '
                     '$bytes_sent/$bytes_received $session_time';
    # Буфер: запись пачками, а не syscall на каждую сессию; 5 с — потолок задержки появления
    # строки при разборе инцидента.
    access_log /var/log/nginx/stream-access.log proxy buffer=64k flush=5s;

    # Прод на Hetzner (docs/modules/infrastructure.md). Меняется только при переезде сервера.
    upstream hetzner_https { server 77.42.23.177:443; }
    upstream hetzner_http  { server 77.42.23.177:80; }

    # proxy_protocol on: перед первыми байтами соединения уходит строка PROXY с адресом клиента.
    # Traefik на Hetzner верит ей только с IP этого VPS (entryPoints.*.proxyProtocol.trustedIPs),
    # так rate limit и allowlist ResultURL на бэкенде видят клиента, а не прокси (ClientIpResolver).
    # Без настройки с обеих сторон Traefik примет строку PROXY за мусор и оборвёт TLS-рукопожатие.
    # proxy_connect_timeout 5s: рукопожатие ДЦ→ДЦ — десятки мс; дольше значит Hetzner недоступен,
    # и клиенту лучше быстрый отказ, чем зависший запрос.
    server {
        listen 443;
        proxy_pass hetzner_https;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        # Простой без байт в обе стороны. Traefik закрывает idle раньше (~3 мин), это верхний предел.
        proxy_timeout 10m;
    }

    # Порт 80 нужен ради двух вещей: редирект http→https делает Traefik, и по нему же проходит
    # HTTP-01 проверка Let's Encrypt при продлении сертификата clubsapp.ru на Hetzner.
    # Обе — короткие запросы, поэтому простой ограничен 2 мин.
    server {
        listen 80;
        proxy_pass hetzner_http;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        proxy_timeout 2m;
    }
}
