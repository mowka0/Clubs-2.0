spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.telegram.telegrambots.longpolling.starter.TelegramBotStarterConfiguration

jwt:
  secret: test-secret-key-that-is-at-least-32-characters-long-for-integration
  expiration: 86400000

telegram:
  bot-token: test-bot-token

s3:
  bucket: test-bucket
  base-url: http://localhost:9000/test-bucket

# Геокодер в тестах не дёргается — значение нужно только чтобы поднялся GeocoderService:
# у yandex.geocoder-referer нет дефолта в @Value, и без него контекст интеграционных тестов
# не стартует (тесты не должны зависеть от env-переменных на машине разработчика).
yandex:
  geocoder-referer: https://example.test
