server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Формат main образа nginx — с X-Forwarded-For последним полем. По нему проверяется, что
    # через российский прокси (infra/ru-proxy) до нас доходит IP клиента, а не адрес прокси.
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # Защита от кликджекинга — через CSP frame-ancestors, а НЕ через X-Frame-Options.
    # Telegram Web (web.telegram.org) открывает Mini App во фрейме со своего домена,
    # поэтому SAMEORIGIN/DENY делают приложение полностью неоткрываемым в браузере:
    # фрейм не рендерится вообще, пользователь видит белый экран. Нативные клиенты
    # (iOS/Android/Desktop) используют WebView и заголовок игнорируют — там баг незаметен.
    # X-Frame-Options не поддерживает whitelist доменов (ALLOW-FROM мёртв в современных
    # браузерах), поэтому единственный корректный инструмент — frame-ancestors со списком
    # доменов Telegram. Встраивание с посторонних сайтов по-прежнему запрещено.
    # Заголовок повторён в каждом location: add_header внутри location ЗАМЕНЯЕТ,
    # а не дополняет заголовки внешнего уровня. По той же причине в каждом location повторяется
    # HSTS (`.claude/rules/security.md` § HTTPS): TLS терминирует Traefik, но заголовок обязан
    # прийти клиенту. Без `includeSubDomains` и `preload` намеренно — домен `sslip.io` общий,
    # и жёсткая политика задела бы чужие поддоменные стенды.

    # Проксирование API-запросов на backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        # Загрузка аватаров идёт через /api/upload (backend ограничивает 5 МБ).
        # Дефолт nginx — 1 МБ, что даёт 413 Request Entity Too Large
        # для типичных фото с телефона — поднимаем до 6 МБ (1 МБ запаса сверх лимита backend).
        client_max_body_size 6M;
        # Бэкенд HSTS не шлёт, а политика должна быть одна на весь трафик домена.
        # nosniff здесь не дублируем: его ставит Spring Security.
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Публичные загрузки (аватары и т.д.) — проксируем на MinIO по внутренней сети.
    # Собственный порт MinIO НЕ выставлен наружу, поэтому фасад здесь.
    # Backend возвращает относительные URL вида "/uploads/<uuid>.png" (S3_BASE_URL пустой),
    # а nginx переписывает их в path-style MinIO "<minio>/<bucket>/<key>".
    # Имя бакета захардкожено под дефолт docker-compose (S3_BUCKET=clubs-uploads);
    # если бакет переименуют в env — обновить и здесь.
    #
    # ^~ важен: без него ниже побеждает regex-location для *.jpg/*.png
    # (nginx предпочитает совпадающие regex-локации перед префиксными), и запросы к
    # /uploads/<uuid>.jpg попадают в try_files → 404 вместо проксирования на MinIO.
    location ^~ /uploads/ {
        proxy_pass http://minio:9000/clubs-uploads/uploads/;
        proxy_set_header Host $http_host;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-meta-server-side-encryption;
        # MinIO шлёт собственные HSTS (с includeSubDomains) и nosniff. Два разных HSTS в одном
        # ответе — хуже, чем один: по RFC 6797 браузер берёт первый и молча игнорирует второй,
        # то есть политику сайта определял бы апстрим. Прячем апстримные и ставим свои.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        add_header Cache-Control "public, max-age=31536000" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Статика с хэшем в имени — безопасно кэшировать надолго, имя файла меняется при изменении контента.
    # `immutable` НЕ ставим (инцидент 2026-08-02): он запрещает браузеру перепроверять файл даже при
    # перезагрузке, и однажды оборванный бандл оставался в кэше год — приложение не поднималось у
    # человека вообще ничем, кроме ручной чистки данных сайта. Без него обычный reload шлёт
    # условный запрос и чинит битый кэш; на трафик это почти не влияет — имя файла всё равно
    # меняется при каждой сборке, и попаданий в 304 больше, чем перекачек.
    # Примечание: add_header внутри location заменяет (не объединяет) server-level заголовки,
    # поэтому security-заголовки нужно повторить здесь.
    # webp в списке намеренно: без него .webp-ассет бандла не попадает сюда и проваливается
    # в SPA-фолбэк — браузер получает index.html вместо картинки. Загруженных пользователями
    # файлов это не касается: у `^~ /uploads/` приоритет выше regex-локации.
    location ~* \.(js|css|png|jpg|jpeg|webp|gif|ico|svg|woff|woff2)$ {
        add_header Cache-Control "public, max-age=31536000" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://webk.telegram.org https://webz.telegram.org" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html — никогда не кэшировать. Хэши внутри ссылаются на версионированные бандлы;
    # устаревший index.html заставит браузер запрашивать ассеты, которых после деплоя уже нет.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://webk.telegram.org https://webz.telegram.org" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback — все остальные маршруты отдают index.html (тоже не должен кэшироваться).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://webk.telegram.org https://webz.telegram.org" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
